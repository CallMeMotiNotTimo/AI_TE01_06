[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-planner"
version = "0.1.0"
description = "A beginner-friendly planner-executor-reviewer multi-agent workflow."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Revanth Pattipati" }
]
license = { text = "MIT" }
dependencies = []

[project.scripts]
multi-agent-planner = "multi_agent_planner.main:main"

[tool.setuptools.packages.find]
where = ["src"]
